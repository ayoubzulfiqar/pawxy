name: pawxy
description: "Enterprise-Grade WireGuard VPN Client"
publish_to: 'none'

version: 1.6.9+169

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  http: ^1.2.0
  path: ^1.9.0
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  wireguard_flutter_plus: ^1.0.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/pawxy.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/pawxy.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/pawxy.png"

flutter:
  uses-material-design: true
  assets:
    - assets/pawxy.png
    - assets/fallback_manifest.json
    - assets/fallback_us.conf
